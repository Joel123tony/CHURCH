services:
  - type: web
    name: church-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK_DB
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        sync: false
      - key: PUBLIC_WEB_URL
        value: https://methodistchurchpadikuppam.netlify.app
      - key: ADMIN_WEB_URL
        value: https://adminmethodistpadikuppam.netlify.app
      - key: API_BASE_URL
        value: https://church-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://methodistchurchpadikuppam.netlify.app,https://adminmethodistpadikuppam.netlify.app
